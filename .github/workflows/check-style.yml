name: Check Style

# SNOW-4039899 scratch branch: disabled (see put-throughput-probe.yml).
on:
    workflow_dispatch:
jobs:
    check-style:
        name: Check Style
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check Style
              shell: bash
              run: mvn clean validate --batch-mode --show-version -P check-style
